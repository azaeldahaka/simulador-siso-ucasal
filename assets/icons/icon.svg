<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner Panel -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="#111827" fill-opacity="0.5" stroke="#334155" stroke-width="4"/>

  <!-- Academic Cap Top -->
  <polygon points="256,120 420,180 256,240 92,180" fill="#38bdf8"/>
  <polygon points="256,132 400,180 256,228 112,180" fill="#0284c7"/>
  <polygon points="256,140 376,180 256,220 136,180" fill="#38bdf8"/>

  <!-- Cap Base -->
  <path d="M166,215 L346,215 L330,270 C330,270 295,300 256,300 C217,300 182,270 182,270 Z" fill="#0369a1"/>

  <!-- Tassel -->
  <path d="M420,180 C440,210 440,240 440,265" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round"/>
  <circle cx="440" cy="275" r="10" fill="#facc15"/>

  <!-- Text "IS" -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">IS</text>

  <!-- Text "UCASAL" -->
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="6">UCASAL</text>
</svg>
